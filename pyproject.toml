[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-recs"
version = "1.0.0"
description = "Multi-stage restaurant recommender on Chicago and Evanston data: two-tower, sequential and content retrieval, a LightGBM ranker, business rules, leakage-safe evaluation and an HTTP API with feedback logging."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shuo Han"}]
keywords = ["recommender system", "recommendation", "two-tower", "learning to rank", "semantic ids",
            "sequential recommendation", "lightgbm", "pytorch", "google local", "restaurant"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
serve = ["lightgbm>=3.3"]
train = ["torch>=2.0,<3", "sentence-transformers>=2.2", "lightgbm>=3.3"]
llm = ["anthropic>=1.0"]
dev = ["torch>=2.0,<3", "sentence-transformers>=2.2", "lightgbm>=3.3", "pytest>=7"]

[project.urls]
Homepage = "https://hanshuo-shuo.github.io/chicago-restaurant-recommender/"
Repository = "https://github.com/hanshuo-shuo/chicago-restaurant-recommender"
Documentation = "https://github.com/hanshuo-shuo/chicago-restaurant-recommender/blob/main/docs/design.md"

[project.scripts]
recsys = "restaurant_recs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restaurant_recs = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
