<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="System flow: offline ingestion, features, retrieval models and a LightGBM ranker produce versioned artifacts; online, a request goes through candidate generation, business rules, the ranker and an optional LLM arm; impressions and events are logged and feed per-arm CTR and a position-debiased ranker.">
<style>
.ad-t{font:600 12.5px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1B2733}
.ad-s{font:400 10.5px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#5C6B7A}
.ad-lab{font:700 10.5px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#2B6CB0;letter-spacing:1.6px}
.ad-lab2{font:400 10.5px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#5C6B7A}
.ad-el{font:400 10.5px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#4A5A6A}
.ad-bg{fill:#FFFFFF}.ad-lane{fill:#F2F5F9}.ad-lane2{fill:#F7F7F4}
.ad-box{fill:#FFFFFF;stroke:#C5CFDA;stroke-width:1.2}
.ad-model{fill:#E6F0FA;stroke:#2B6CB0;stroke-width:1.2}
.ad-store{fill:#EEF1F4;stroke:#9AA7B4;stroke-width:1.2}
.ad-group{fill:#FBFCFE;stroke:#2B6CB0;stroke-width:1;stroke-dasharray:3 3}
.ad-opt{stroke-dasharray:5 4}
.ad-edge{fill:none;stroke:#4A5A6A;stroke-width:1.3}
.ad-div{stroke:#B9C4CF;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A6A"/></marker></defs>
<rect class="ad-bg" x="0" y="0" width="1200" height="664" rx="14"/>
<rect class="ad-lane" x="12" y="14" width="1176" height="300" rx="12"/>
<text class="ad-lab" x="28" y="40" text-anchor="start">OFFLINE</text>
<text class="ad-lab2" x="96" y="40" text-anchor="start">training, selection on validation, one scoring of the test split  ·  make data train</text>
<rect class="ad-box" x="24" y="96" width="150" height="58" rx="8"/>
<text class="ad-t" x="99.0" y="120.0" text-anchor="middle">Google Local (2021)</text>
<text class="ad-s" x="99.0" y="135.0" text-anchor="middle">23M Illinois ratings</text>
<rect class="ad-box" x="204" y="96" width="160" height="58" rx="8"/>
<text class="ad-t" x="284.0" y="120.0" text-anchor="middle">Ingest &amp; validate</text>
<text class="ad-s" x="284.0" y="135.0" text-anchor="middle">scope · dedupe · 5/10-core</text>
<rect class="ad-box" x="394" y="96" width="150" height="58" rx="8"/>
<text class="ad-t" x="469.0" y="120.0" text-anchor="middle">Chronological split</text>
<text class="ad-s" x="469.0" y="135.0" text-anchor="middle">train · validation · test</text>
<rect class="ad-box" x="574" y="96" width="170" height="58" rx="8"/>
<text class="ad-t" x="659.0" y="120.0" text-anchor="middle">Item features</text>
<text class="ad-s" x="659.0" y="135.0" text-anchor="middle">MiniLM text · categories · geo</text>
<rect class="ad-group" x="774" y="52" width="200" height="154" rx="10"/>
<text class="ad-lab" x="874" y="70" text-anchor="middle">RETRIEVAL MODELS</text>
<rect class="ad-model" x="786" y="80" width="176" height="34" rx="8"/>
<text class="ad-t" x="874.0" y="101.5" text-anchor="middle">Two-tower · in-batch + logQ</text>
<rect class="ad-model" x="786" y="122" width="176" height="34" rx="8"/>
<text class="ad-t" x="874.0" y="143.5" text-anchor="middle">Semantic IDs · RQ-KMeans</text>
<rect class="ad-model" x="786" y="164" width="176" height="34" rx="8"/>
<text class="ad-t" x="874.0" y="185.5" text-anchor="middle">Sequential Transformer</text>
<rect class="ad-model" x="1004" y="96" width="172" height="58" rx="8"/>
<text class="ad-t" x="1090.0" y="120.0" text-anchor="middle">LightGBM ranker</text>
<text class="ad-s" x="1090.0" y="135.0" text-anchor="middle">14 features · loss chosen on val</text>
<rect class="ad-box" x="774" y="232" width="200" height="50" rx="8"/>
<text class="ad-t" x="874.0" y="252.0" text-anchor="middle">Offline evaluation</text>
<text class="ad-s" x="874.0" y="267.0" text-anchor="middle">full catalog · NDCG@10 · 95% CI</text>
<rect class="ad-store" x="1004" y="232" width="172" height="50" rx="8"/>
<text class="ad-t" x="1090.0" y="252.0" text-anchor="middle">Versioned artifacts</text>
<text class="ad-s" x="1090.0" y="267.0" text-anchor="middle">data fingerprint · model version</text>
<path class="ad-edge" d="M174,125.0 H204" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M364,125.0 H394" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M544,125.0 H574" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M744,125.0 H774" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M974,125.0 H1004" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M874,206 V232" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M1090,154 V232" marker-end="url(#ad-arrow)"/>
<text class="ad-el" x="1082" y="222" text-anchor="end">weights · trees · report</text>
<line class="ad-div" x1="12" y1="322" x2="1188" y2="322"/>
<rect class="ad-lane2" x="12" y="330" width="1176" height="322" rx="12"/>
<text class="ad-lab" x="28" y="354" text-anchor="start">ONLINE</text>
<text class="ad-lab2" x="90" y="354" text-anchor="start">serving, logging and learning from feedback  ·  make serve</text>
<rect class="ad-group" x="194" y="366" width="790" height="104" rx="10"/>
<text class="ad-lab" x="974" y="382" text-anchor="end">INFERENCE ENGINE  ·  NumPy + LightGBM, no PyTorch at serving time</text>
<rect class="ad-box" x="24" y="390" width="150" height="58" rx="8"/>
<text class="ad-t" x="99.0" y="414.0" text-anchor="middle">POST /api/recommend</text>
<text class="ad-s" x="99.0" y="429.0" text-anchor="middle">cuisines · location · price · seeds</text>
<rect class="ad-box" x="204" y="390" width="160" height="58" rx="8"/>
<text class="ad-t" x="284.0" y="414.0" text-anchor="middle">Candidate generation</text>
<text class="ad-s" x="284.0" y="429.0" text-anchor="middle">4 sources · ≈220 candidates</text>
<rect class="ad-box" x="394" y="390" width="150" height="58" rx="8"/>
<text class="ad-t" x="469.0" y="414.0" text-anchor="middle">Business rules</text>
<text class="ad-s" x="469.0" y="429.0" text-anchor="middle">cuisine · distance · price · hours</text>
<rect class="ad-model" x="574" y="390" width="170" height="58" rx="8"/>
<text class="ad-t" x="659.0" y="414.0" text-anchor="middle">LightGBM ranker</text>
<text class="ad-s" x="659.0" y="429.0" text-anchor="middle">fallback: fixed blend</text>
<rect class="ad-box ad-opt" x="774" y="390" width="200" height="58" rx="8"/>
<text class="ad-t" x="874.0" y="414.0" text-anchor="middle">LLM rerank · optional arm</text>
<text class="ad-s" x="874.0" y="429.0" text-anchor="middle">2 orders · Borda merge · fallback</text>
<rect class="ad-box" x="1004" y="390" width="172" height="58" rx="8"/>
<text class="ad-t" x="1090.0" y="414.0" text-anchor="middle">Top-k + explanations</text>
<text class="ad-s" x="1090.0" y="429.0" text-anchor="middle">model version · latency</text>
<path class="ad-edge" d="M174,419.0 H204" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M364,419.0 H394" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M544,419.0 H574" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M744,419.0 H774" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M974,419.0 H1004" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M1090,282 V340 H880 V366" marker-end="url(#ad-arrow)"/>
<text class="ad-el" x="1076" y="335" text-anchor="end">loaded at startup, verified against the data fingerprint</text>
<rect class="ad-box" x="24" y="528" width="150" height="56" rx="8"/>
<text class="ad-t" x="99.0" y="551.0" text-anchor="middle">POST /api/events</text>
<text class="ad-s" x="99.0" y="566.0" text-anchor="middle">click · favorite</text>
<rect class="ad-store" x="204" y="506" width="300" height="100" rx="8"/>
<text class="ad-t" x="354.0" y="544.5" text-anchor="middle">Impression log · SQLite</text>
<text class="ad-s" x="354.0" y="559.5" text-anchor="middle">request · position · scores · model version</text>
<text class="ad-s" x="354.0" y="572.5" text-anchor="middle">events accepted only against a logged impression</text>
<rect class="ad-model" x="574" y="506" width="170" height="44" rx="8"/>
<text class="ad-t" x="659.0" y="523.0" text-anchor="middle">Debiased feedback ranker</text>
<text class="ad-s" x="659.0" y="538.0" text-anchor="middle">MMoE + position tower</text>
<rect class="ad-box" x="574" y="562" width="170" height="44" rx="8"/>
<text class="ad-t" x="659.0" y="579.0" text-anchor="middle">Per-arm CTR · favorite rate</text>
<text class="ad-s" x="659.0" y="594.0" text-anchor="middle">A/B readout</text>
<path class="ad-edge" d="M174,556 H204" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M504,556 H540 V528 H574" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M540,556 V584 H574" marker-end="url(#ad-arrow)"/>
<path class="ad-edge" d="M1090,448 V626 H354 V606" marker-end="url(#ad-arrow)"/>
<text class="ad-el" x="720" y="620" text-anchor="middle">one impression row per returned item</text>
<path class="ad-edge ad-opt" d="M659,506 V470" marker-end="url(#ad-arrow)"/>
<text class="ad-el" x="668" y="492" text-anchor="start">swaps in once real traffic reaches 2k impressions</text>
</svg>
